
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Phase 5 — legacy B2C → enterprise IA (301 for SEO / bookmarks)
    location = /consulting { return 301 /services; }
    location ^~ /consulting/ { return 301 /services; }
    location = /research { return 301 /products; }
    location ^~ /research/ { return 301 /products; }
    location = /training { return 301 /services; }
    location ^~ /training/ { return 301 /services; }
    location = /contribute { return 301 /about; }
    location = /gallery { return 301 /about; }
    location = /events { return 301 /products/trizen-community; }
    location ^~ /project/ { return 301 /products; }
    location ^~ /ongoing-project/ { return 301 /case-studies; }
    location = /certificate-test { return 301 /; }

    # Solutions / Accelerators → Products
    location = /solutions { return 301 /products; }
    location ^~ /solutions/ { return 301 /products; }
    location = /accelerators { return 301 /products; }
    location = /accelerators/trizen-certify { return 301 /products/trizen-hr; }
    location = /accelerators/trizen-labs { return 301 /products/trizen-community; }
    location = /accelerators/trizen-deploy { return 301 /products/trizen-dialog; }
    location ^~ /accelerators/ { return 301 /products; }

    # Renamed product slugs
    location = /products/trizen-certify { return 301 /products/trizen-hr; }
    location = /products/trizen-labs { return 301 /products/trizen-community; }

    # Serve certificates directory with proper MIME types
    location /certificates/ {
        alias /usr/share/nginx/html/certificates/;
        types {
            application/pdf pdf;
            image/png png;
        }
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        expires 0;
        try_files $uri $uri/ =404;
    }

    # Prevent stale index from pinning old JS bundles after deploys
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
